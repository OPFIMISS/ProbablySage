[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probablysage"
version = "0.1.2"
description = "Local Probably Stolen source and official modding documentation MCP. Quick start: ask your Agent to install https://github.com/OPFIMISS/ProbablySage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp==2.3.0",
  "tree-sitter==0.25.2",
  "tree-sitter-c-sharp==0.23.5",
]

[project.scripts]
probablysage = "probablysage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
probablysage = ["practice/*.md"]
